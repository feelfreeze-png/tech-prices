name: tech-prices

on:
  schedule:
    # 22:37 UTC = 18:37 EDT / 17:37 EST — всегда после закрытия рынка США; второй запуск — резерв
    - cron: '37 22 * * 1-5'
    - cron: '37 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert
        run: |
          set -euo pipefail
          mkdir -p tech
          # таймауты — чтобы зависший запрос не держал общую очередь prices часами
          yget() {
            local a h
            for a in 1 2 3 4 5; do
              for h in query1 query2; do
                if curl -fsS --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 5 --retry-all-errors -H 'User-Agent: Mozilla/5.0' "https://${h}.finance.yahoo.com/$1" -o "$2" \
                   && [ "$(jq -r '.chart.error' "$2" 2>/dev/null)" = "null" ]; then return 0; fi
                sleep $((a*15))
              done
            done
            return 1
          }
          TICKERS="NVDA MRVL ANET GEV VRT ETN AVGO TSM AMD MPWR ON PWR DELL VST ADI TXN MU SPY"
          FAILED=""
          for T in $TICKERS; do
            if ! yget "v8/finance/chart/${T}?range=2y&interval=1d" "/tmp/${T}.json"; then
              FAILED="$FAILED $T"; continue
            fi
            jq -r '
              .chart.result[0] as $r
              | ($r.indicators.quote[0]) as $q
              | ($r.indicators.adjclose[0].adjclose) as $a
              | "date,open,high,low,close,adjclose,volume",
                ( range(0; ($r.timestamp | length)) as $i
                  | [ ($r.timestamp[$i] | gmtime | strftime("%Y-%m-%d")),
                      $q.open[$i], $q.high[$i], $q.low[$i], $q.close[$i], $a[$i], $q.volume[$i] ]
                  | @csv )
            ' "/tmp/${T}.json" > "tech/${T}.csv"
            ROWS=$(wc -l < "tech/${T}.csv")
            if [ "$ROWS" -lt 100 ]; then FAILED="$FAILED ${T}(rows=${ROWS})"; fi
            sleep 3
          done
          if [ -n "$FAILED" ]; then echo "FAILED:$FAILED" >&2; exit 1; fi
          # свежесть: последняя сессия SPY не старше 4 дней (запас на праздники) — иначе красный прогон
          LAST=$(tail -n1 tech/SPY.csv | cut -d, -f1 | tr -d '"')
          MIN=$(date -u -d '4 days ago' +%F)
          if [[ "$LAST" < "$MIN" ]]; then echo "STALE: last session $LAST, need >= $MIN" >&2; exit 1; fi
          date -u +%FT%TZ > tech/_updated.txt

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech
          git diff --quiet --cached || git commit -m "tech prices $(date -u +%F)"
          git pull --rebase
          git push
